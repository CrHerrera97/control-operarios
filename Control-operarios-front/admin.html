<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registros | Control de operarios</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
	<style>
		:root { --azul: #31629a; --amarillo: #f5c223; --blanco: #fff; }
		* { box-sizing: border-box; }
		body { margin: 0; padding: 28px; font-family: Arial, sans-serif; background: #f4f5f7; color: #1f2f43; }
		main { max-width: 1400px; margin: 0 auto; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
		h1 { margin: 0; color: var(--azul); }
		.acciones-header { display: flex; flex-wrap: wrap; gap: 8px; }
		a, button { border: 0; border-radius: 8px; padding: 12px 16px; background: var(--azul); color: var(--blanco); font: inherit; font-weight: bold; text-decoration: none; cursor: pointer; }
		button { background: #b83232; }
		.cerrar-sesion { background: #657386; }
		.eliminar-registro { padding: 12px 16px; font: inherit; white-space: nowrap; }
		.tabla-contenedor { overflow-x: auto; background: var(--blanco); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
		table { width: 100%; min-width: 980px; border-collapse: collapse; }
		th, td { padding: 14px 12px; border-bottom: 1px solid rgba(119, 134, 156, 0.35); text-align: left; vertical-align: middle; }
		th { background: var(--azul); color: var(--blanco); white-space: nowrap; }
		tr:last-child td { border-bottom: 0; }
		th:nth-child(7), td:nth-child(7) { border-bottom-color: rgba(119, 134, 156, 0.2); }
		.movimiento { font-weight: bold; }
		.entrada { color: #227447; }
		.salida { color: #b83232; }
		.foto { width: 120px; height: 90px; border-radius: 6px; object-fit: cover; display: block; cursor: pointer; transition: transform .2s ease; border: 1px solid rgba(49, 98, 154, 0.18); }
		.foto:hover { transform: scale(1.03); }
		.foto-link { display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #fff; }
		.mapa-enlace { white-space: nowrap; }
		.vacio { padding: 34px; text-align: center; color: #657386; }
		.modal-foto { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 1000; }
		.modal-foto.visible { display: flex; }
		.modal-cuerpo { position: relative; max-width: min(90vw, 900px); max-height: 90vh; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
		.modal-cuerpo img { display: block; max-width: 100%; max-height: 78vh; border-radius: 10px; object-fit: contain; background: #f4f5f7; }
		.cerrar-foto { position: absolute; top: 12px; right: 12px; border: 0; border-radius: 999px; background: rgba(184, 50, 50, .95); color: #fff; width: 38px; height: 38px; font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
		.nota { margin: 0 0 16px; color: #657386; font-size: 14px; }
		.filtros { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 12px; margin-bottom: 18px; padding: 16px; background: var(--blanco); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
		.filtros label { display: flex; flex-direction: column; gap: 6px; color: var(--azul); font-size: 13px; font-weight: bold; }
		.filtros input, .filtros select { width: 100%; min-height: 42px; padding: 9px 10px; border: 2px solid #d7e0eb; border-radius: 7px; color: #1f2f43; font: inherit; }
		.filtros input:focus, .filtros select:focus { border-color: var(--azul); outline: none; }
		.limpiar { align-self: end; background: #657386; white-space: nowrap; }
		.resultados { margin: 0 0 12px; color: #657386; font-size: 14px; }
		.exportar { display: flex; gap: 10px; margin-bottom: 18px; }
		.exportar button { background: #227447; }
		.exportar .pdf { background: #b83232; }
		.modal-mapa { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 1000; }
		.modal-mapa.visible { display: flex; }
		.modal-mapa-cuerpo { position: relative; width: min(94vw, 1100px); height: 82vh; max-height: 720px; min-height: 420px; background: #fff; border-radius: 14px; padding: 18px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
		#mapaOperarios { width: 100%; height: 100%; min-height: 0; border-radius: 10px; }
		.mapa-popup { position: absolute; bottom: 36px; left: 36px; min-width: 190px; max-width: 280px; padding: 10px 14px; border-radius: 8px; background: #fff; box-shadow: 0 3px 14px rgba(15, 23, 42, .25); color: #1f2f43; font-size: 13px; line-height: 1.45; }
		.mapa-popup.oculto { display: none; }
		.cerrar-mapa { position: absolute; top: 28px; right: 28px; z-index: 500; border: 0; border-radius: 999px; background: rgba(184, 50, 50, .95); color: #fff; width: 38px; height: 38px; font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
		@media print { body { padding: 0; background: #fff; } header, .filtros, .nota, .resultados, .exportar { display: none; } .tabla-contenedor { box-shadow: none; } table { min-width: 0; font-size: 10px; } .foto { width: 80px; height: 60px; } }
		@media (max-width: 620px) { body { padding: 18px 12px; } header { align-items: flex-start; flex-direction: column; } h1 { font-size: 25px; } }
		@media (max-width: 900px) { .filtros { grid-template-columns: repeat(2, 1fr); } .limpiar { align-self: center; } }
		@media (max-width: 480px) { .filtros { grid-template-columns: 1fr; } .limpiar { width: 100%; } }
	</style>
</head>
<body>
<main>
	<header>
		<h1>Registro de movimientos</h1>
		<div class="acciones-header">
			<a href="usuarios.html">Gestionar usuarios</a>
			<button type="button" onclick="abrirMapaOperarios()">Ver operarios en mapa</button>
			<button class="cerrar-sesion" type="button" onclick="window.location.href = 'logout.html'">Cerrar sesión</button>
		</div>
	</header>
	<p class="nota" id="estadoFecha"></p>
	<section class="filtros" aria-label="Filtros de registros">
		<label for="filtroPersona">Persona
			<input type="search" id="filtroPersona" placeholder="Buscar por nombre">
		</label>
		<label for="filtroTipo">Movimiento
			<select id="filtroTipo">
				<option value="">Todos</option>
				<option value="ENTRADA">ENTRADA</option>
				<option value="SALIDA">SALIDA</option>
			</select>
		</label>
		<label for="filtroObra">Obra
			<input type="search" id="filtroObra" placeholder="Buscar por obra">
		</label>
		<label for="filtroDesde">Desde
			<input type="date" id="filtroDesde">
		</label>
		<label for="filtroHasta">Hasta
			<input type="date" id="filtroHasta">
		</label>
		<button class="limpiar" type="button" onclick="limpiarFiltros()">Limpiar filtros</button>
	</section>
	<p class="resultados" id="contadorRegistros"></p>
	<div class="exportar">
		<button type="button" onclick="exportarExcel()">Exportar Excel</button>
		<button class="pdf" type="button" onclick="exportarPdf()">Exportar PDF</button>
	</div>
	<section class="tabla-contenedor">
		<table>
			<thead>
				<tr><th>Persona</th><th>Movimiento</th><th>Obra</th><th>Latitud</th><th>Longitud</th><th>IP</th><th>Mapa</th><th>Fotografía</th><th>Fecha y hora</th><th>Acción</th></tr>
			</thead>
			<tbody id="registros"></tbody>
		</table>
		<div class="vacio" id="vacio">Todavía no hay movimientos registrados.</div>
	</section>
	<div id="modalFoto" class="modal-foto" aria-modal="true" role="dialog" aria-label="Vista de la fotografía">
		<div class="modal-cuerpo">
			<button class="cerrar-foto" type="button" aria-label="Cerrar vista" onclick="cerrarFoto()">×</button>
			<img id="modalImagen" src="" alt="Fotografía ampliada">
		</div>
	</div>
	<div id="modalMapa" class="modal-mapa" aria-modal="true" role="dialog" aria-label="Ubicación de los operarios">
		<div class="modal-mapa-cuerpo">
			<button class="cerrar-mapa" type="button" aria-label="Cerrar mapa" onclick="cerrarMapa()">×</button>
			<div id="mapaOperarios"></div>
			<div id="mapaPopup" class="mapa-popup oculto"></div>
		</div>
	</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
<script>
	const URL_MOVIMIENTOS = 'https://asistencia.rhelectronics.com.co/backend-control-operarios/controllers/movimientos.php';
	const sesion = JSON.parse(localStorage.getItem('usuarioSesion') || 'null');
	if (!sesion || sesion.rol !== 'ADMIN') {
		window.location.replace('login.html');
	}
	const cuerpo = document.getElementById("registros");
	const vacio = document.getElementById("vacio");
	const estadoFecha = document.getElementById("estadoFecha");
	const contadorRegistros = document.getElementById("contadorRegistros");
	const filtroPersona = document.getElementById("filtroPersona");
	const filtroTipo = document.getElementById("filtroTipo");
	const filtroObra = document.getElementById("filtroObra");
	const filtroDesde = document.getElementById("filtroDesde");
	const filtroHasta = document.getElementById("filtroHasta");
	let registros = [];
	let registrosVisibles = [];
	let mapaOperarios = null;
	let fuenteMapa = null;

	function mostrarRegistros() {
		const personaBuscada = filtroPersona.value.trim().toLocaleLowerCase();
		const tipoBuscado = filtroTipo.value;
		const obraBuscada = filtroObra.value.trim().toLocaleLowerCase();
		const fechaDesde = filtroDesde.value ? new Date(filtroDesde.value + "T00:00:00") : null;
		const fechaHasta = filtroHasta.value ? new Date(filtroHasta.value + "T23:59:59.999") : null;
		const registrosFiltrados = registros.filter(function(registro) {
			const fechaRegistro = new Date(registro.fecha_hora);
			const coincidePersona = !personaBuscada || registro.persona.toLocaleLowerCase().includes(personaBuscada);
			const coincideTipo = !tipoBuscado || registro.tipo === tipoBuscado;
			const coincideObra = !obraBuscada || (registro.obra || "").toLocaleLowerCase().includes(obraBuscada);
			const coincideDesde = !fechaDesde || fechaRegistro >= fechaDesde;
			const coincideHasta = !fechaHasta || fechaRegistro <= fechaHasta;
			return coincidePersona && coincideTipo && coincideObra && coincideDesde && coincideHasta;
		});
		registrosVisibles = registrosFiltrados;

		cuerpo.innerHTML = "";
		registrosFiltrados.forEach(function(registro) {
		const fila = document.createElement("tr");
		const claseMovimiento = registro.tipo === "ENTRADA" ? "entrada" : "salida";
		const fotoSrc = `data:image/jpeg;base64,${registro.fotografia}`;
		fila.innerHTML = `
			<td>${escapar(registro.persona)}</td>
			<td class="movimiento ${claseMovimiento}">${escapar(registro.tipo)}</td>
			<td>${escapar(registro.obra || "")}</td>
			<td>${Number(registro.latitud).toFixed(6)}</td>
			<td>${Number(registro.longitud).toFixed(6)}</td>
			<td>${escapar(registro.ip_address || "No disponible")}</td>
			<td><a class="mapa-enlace" href="https://www.google.com/maps?q=${Number(registro.latitud)},${Number(registro.longitud)}" target="_blank" rel="noopener noreferrer">Ver mapa</a></td>
			<td><a class="foto-link" href="#" data-imagen="${fotoSrc}" aria-label="Ver foto de ${escapar(registro.persona)}"><img class="foto" src="${fotoSrc}" alt="Foto de ${escapar(registro.persona)}"></a></td>
			<td>${new Date(registro.fecha_hora).toLocaleString("es-ES")}</td>
			<td><button class="eliminar-registro" type="button" data-id="${Number(registro.id)}" data-persona="${escapar(registro.persona)}">Eliminar</button></td>`;
		cuerpo.appendChild(fila);
		});

		const enlacesFoto = document.querySelectorAll(".foto-link");
		enlacesFoto.forEach(function(enlace) {
			enlace.addEventListener("click", function(evento) {
				evento.preventDefault();
				abrirFoto(this.dataset.imagen);
			});
		});

		const botonesEliminar = document.querySelectorAll(".eliminar-registro");
		botonesEliminar.forEach(function(boton) {
			boton.addEventListener("click", function() {
				eliminarRegistro(Number(this.dataset.id), this.dataset.persona);
			});
		});

		vacio.textContent = registros.length ? "No hay registros que coincidan con los filtros." : "Todavía no hay movimientos registrados.";
		vacio.style.display = registrosFiltrados.length ? "none" : "block";
		contadorRegistros.textContent = `Mostrando ${registrosFiltrados.length} de ${registros.length} registros`;
	}

	[filtroPersona, filtroTipo, filtroObra, filtroDesde, filtroHasta].forEach(function(filtro) {
		filtro.addEventListener("input", mostrarRegistros);
		filtro.addEventListener("change", mostrarRegistros);
	});

	function limpiarFiltros() {
		filtroPersona.value = "";
		filtroTipo.value = "";
		filtroObra.value = "";
		filtroDesde.value = "";
		filtroHasta.value = "";
		mostrarRegistros();
	}

	function exportarExcel() {
		if (!registrosVisibles.length) {
			alert("No hay registros para exportar.");
			return;
		}

		const filas = registrosVisibles.map(function(registro) {
			return [
				registro.persona,
				registro.tipo,
				registro.obra || "",
				registro.latitud,
				registro.longitud,
				new Date(registro.fecha_hora).toLocaleString("es-ES")
			];
		});
		const contenido = [["Persona", "Movimiento", "Obra", "Latitud", "Longitud", "Fecha y hora"]]
			.concat(filas)
			.map(function(fila) { return fila.map(celda).join(";"); })
			.join("\r\n");
		const archivo = new Blob(["\uFEFF" + contenido], { type: "text/csv;charset=utf-8;" });
		const enlace = document.createElement("a");
		enlace.href = URL.createObjectURL(archivo);
		enlace.download = "registros-movimientos.csv";
		enlace.click();
		URL.revokeObjectURL(enlace.href);
	}

	function celda(valor) {
		return `"${String(valor == null ? "" : valor).replace(/"/g, '""')}"`;
	}

	function exportarPdf() {
		if (!registrosVisibles.length) {
			alert("No hay registros para exportar.");
			return;
		}
		window.print();
	}

	function obtenerOperariosActivos() {
		const ultimoMovimientoPorPersona = new Map();
		registros.forEach(function(registro) {
			const nombre = String(registro.persona || "").trim();
			const clave = nombre.toLocaleLowerCase();
			if (!clave) return;
			const fecha = new Date(registro.fecha_hora).getTime();
			const movimientoAnterior = ultimoMovimientoPorPersona.get(clave);
			if (!movimientoAnterior || fecha >= movimientoAnterior.fecha) {
				ultimoMovimientoPorPersona.set(clave, { registro: registro, fecha: fecha });
			}
		});

		return Array.from(ultimoMovimientoPorPersona.values())
			.filter(function(movimiento) { return movimiento.registro.tipo === "ENTRADA"; })
			.map(function(movimiento) { return movimiento.registro; });
	}

	function abrirMapaOperarios() {
		const ubicaciones = obtenerOperariosActivos().filter(function(registro) {
			const latitud = Number(registro.latitud);
			const longitud = Number(registro.longitud);
			return Number.isFinite(latitud) && Number.isFinite(longitud) && latitud >= -90 && latitud <= 90 && longitud >= -180 && longitud <= 180;
		});
		if (!ubicaciones.length) {
			alert("No hay registros con una ubicación válida para mostrar.");
			return;
		}

		const modal = document.getElementById("modalMapa");
		modal.classList.add("visible");
		if (mapaOperarios) mapaOperarios.setTarget(null);

		requestAnimationFrame(function() {
			fuenteMapa = new ol.source.Vector();
			ubicaciones.forEach(function(registro) {
				const punto = ol.proj.fromLonLat([Number(registro.longitud), Number(registro.latitud)]);
				const marcador = new ol.Feature({ geometry: new ol.geom.Point(punto) });
				marcador.set("nombre", `${registro.persona || "Operario"}\nObra: ${registro.obra || "Sin obra"}`);
				marcador.set("informacion", `<strong>${escapar(registro.persona)}</strong><br>${escapar(registro.tipo)}<br>${escapar(registro.obra || "Sin obra")}<br>${new Date(registro.fecha_hora).toLocaleString("es-ES")}`);
				fuenteMapa.addFeature(marcador);
			});

			const popup = document.getElementById("mapaPopup");
			mapaOperarios = new ol.Map({
				target: "mapaOperarios",
				layers: [
					new ol.layer.Tile({ source: new ol.source.OSM() }),
					new ol.layer.Vector({
						source: fuenteMapa,
						style: function(feature) {
							return new ol.style.Style({
								image: new ol.style.Circle({
									radius: 8,
									fill: new ol.style.Fill({ color: "#b83232" }),
									stroke: new ol.style.Stroke({ color: "#fff", width: 2 })
								}),
								text: new ol.style.Text({
									text: String(feature.get("nombre")),
									offsetY: -19,
									font: "bold 12px Arial",
									padding: [2, 4, 2, 4],
									fill: new ol.style.Fill({ color: "#1f2f43" }),
									backgroundFill: new ol.style.Fill({ color: "rgba(255, 255, 255, .9)" }),
									stroke: new ol.style.Stroke({ color: "#fff", width: 3 })
								})
							});
						}
					})
				],
				view: new ol.View({ center: ol.proj.fromLonLat([Number(ubicaciones[0].longitud), Number(ubicaciones[0].latitud)]), zoom: 13 })
			});
			mapaOperarios.getView().fit(fuenteMapa.getExtent(), { padding: [50, 50, 50, 50], maxZoom: 16 });
			mapaOperarios.on("singleclick", function(evento) {
				const marcador = mapaOperarios.forEachFeatureAtPixel(evento.pixel, function(feature) { return feature; });
				if (!marcador) {
					popup.classList.add("oculto");
					return;
				}
				popup.innerHTML = marcador.get("informacion");
				popup.classList.remove("oculto");
			});
			requestAnimationFrame(function() { mapaOperarios.updateSize(); });
		});
	}

	function cerrarMapa() {
		const modal = document.getElementById("modalMapa");
		if (modal) modal.classList.remove("visible");
		const popup = document.getElementById("mapaPopup");
		if (popup) popup.classList.add("oculto");
	}

	async function cargarRegistros() {
		try {
			const respuesta = await fetch(URL_MOVIMIENTOS, {
				method: "GET",
				credentials: "include",
				cache: "no-store"
			});
			const resultado = await respuesta.json();
			if (!respuesta.ok || !resultado.exito) {
				throw new Error(resultado.mensaje || "No se pudieron cargar los movimientos.");
			}
			registros = resultado.movimientos || [];
			estadoFecha.textContent = "Registros cargados desde la base de datos.";
			mostrarRegistros();
		} catch (error) {
			estadoFecha.textContent = error.message || "No se pudo conectar con la base de datos.";
			registros = [];
			mostrarRegistros();
		}
	}

	cargarRegistros();

	function abrirFoto(src) {
		const modal = document.getElementById("modalFoto");
		const imagen = document.getElementById("modalImagen");
		if (!modal || !imagen) return;
		imagen.src = src;
		modal.classList.add("visible");
	}

	function cerrarFoto() {
		const modal = document.getElementById("modalFoto");
		if (!modal) return;
		modal.classList.remove("visible");
	}

	document.getElementById("modalFoto").addEventListener("click", function(evento) {
		if (evento.target === this) {
			cerrarFoto();
		}
	});

	document.addEventListener("keydown", function(evento) {
		if (evento.key === "Escape") {
			cerrarFoto();
			cerrarMapa();
		}
	});

	function escapar(valor) {
		const elemento = document.createElement("span");
		elemento.textContent = valor == null ? "" : valor;
		return elemento.innerHTML;
	}

	async function eliminarRegistro(registroId, persona) {
		if (!registroId || !confirm(`¿Eliminar el registro de ${persona}? Esta acción no se puede deshacer.`)) return;

		try {
			const respuesta = await fetch(`${URL_MOVIMIENTOS}?id=${registroId}`, {
				method: "DELETE",
				credentials: "include"
			});
			const resultado = await respuesta.json();
			if (!respuesta.ok || !resultado.exito) {
				throw new Error(resultado.mensaje || "No se pudo eliminar el registro.");
			}
			registros = registros.filter(function(registro) {
				return Number(registro.id) !== registroId;
			});
			mostrarRegistros();
		} catch (error) {
			alert(error.message || "No se pudo eliminar el registro.");
		}
	}
</script>
</body>
</html>
